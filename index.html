.top{display:flex;justify-content:space-between;align-items:center;gap:40px}
.title{font-size:44px;font-weight:900;letter-spacing:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.title small{display:block;font-size:20px;font-weight:500;letter-spacing:2px;color:#9fb3d8;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:26px;font-weight:700;padding:10px 26px;border-radius:999px;border:2px solid currentColor;display:flex;align-items:center;gap:12px;white-space:nowrap;flex:none}
.pill i{width:14px;height:14px;border-radius:50%;background:currentColor;display:inline-block}
.pill.ready{color:#9fb3d8}.pill.run{color:var(--red)}.pill.run i{animation:blink 1s infinite}
.pill.pause{color:var(--red)}
.pill.over{color:var(--red)}.pill.win{color:var(--green)}
#gear{position:absolute;top:6px;right:8px;width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:#cfe0ff;
  font-size:30px;line-height:44px;padding:0;cursor:pointer;opacity:.22;transition:opacity .2s}
#gear:hover,#gear:focus-visible{opacity:.9;background:#ffffff14}

.timer{text-align:center;margin:6px 0 18px;flex:none}
.timer .lbl{font-size:30px;letter-spacing:10px;color:#9fb3d8;font-weight:700}
.timer .num{display:inline-block;position:relative;cursor:pointer;font-size:250px;line-height:1;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:6px;
  text-shadow:0 0 40px rgba(91,227,255,.45)}
.timer.warn .num{color:var(--red);text-shadow:0 0 50px rgba(255,114,121,.7);animation:pulse 1s infinite}
.timer.over .num{color:var(--red);text-shadow:0 0 50px rgba(255,114,121,.6)}
.timer.win .num{color:var(--green);text-shadow:0 0 50px rgba(76,224,160,.6)}
.timer.paused .num{animation:none}
.timer.paused .num-text{opacity:.55}
.pause-tag{display:none;position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:28px;font-size:44px;letter-spacing:6px;font-weight:900;
  color:#FFD166;border:3px solid #FFD166;border-radius:14px;padding:6px 18px;text-shadow:none;white-space:nowrap;background:rgba(8,19,33,.6)}
.timer.paused .pause-tag{display:block}
.energy{width:1100px;height:16px;margin:14px auto 0;border-radius:99px;background:#ffffff1a;overflow:hidden}
.energy b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyan),#8fb8ff);transition:width .4s}
.timer.warn .energy b,.timer.over .energy b{background:var(--red)}
/* 5～8 組：兩排，倒數縮小讓出空間 */
.board.many .timer{margin:0 0 14px}
.board.many .timer .lbl{font-size:24px;letter-spacing:8px}
.board.many .timer .num{font-size:150px}
.board.many .energy{margin-top:8px;height:12px}

/* 卡片內尺寸都乘 --u（1px × 縮放係數 k，依組數／任務數自動算到不爆框） */
.grid{flex:1;min-height:0;display:grid;gap:28px;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(0,1fr)}
.board.many .grid{gap:22px}
.team{--u:calc(var(--k,1)*1px);--v:var(--u);position:relative;border-radius:calc(22*var(--u));padding:calc(22*var(--v)) calc(22*var(--u)) calc(18*var(--v));
  background:rgba(12,28,52,.82);border:3px solid #2b4673;display:flex;flex-direction:column;cursor:pointer;overflow:hidden;min-width:0}
.team .hd{display:flex;justify-content:space-between;align-items:baseline;gap:calc(12*var(--u));margin-bottom:calc(10*var(--v))}
.team .nm{font-size:calc(40*var(--u));font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.team .ct{font-size:calc(28*var(--u));font-weight:700;color:#9fb3d8;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:calc(12*var(--u));border-radius:99px;background:#ffffff1a;margin-bottom:calc(16*var(--v));overflow:hidden;flex:none}
.bar b{display:block;height:100%;background:var(--cyan);border-radius:99px}
.task{display:flex;align-items:center;gap:calc(14*var(--u));padding:calc(12*var(--v)) calc(14*var(--u));border-radius:calc(14*var(--u));margin-bottom:calc(10*var(--v));
  border:2px solid transparent;font-size:calc(28*var(--u));font-weight:700;overflow:hidden;flex:none}
.task .ic{font-size:calc(34*var(--u));width:calc(46*var(--u));text-align:center;flex:none;line-height:1.25}
.task .tn{flex:1;white-space:nowrap}
.task .st{font-size:calc(22*var(--u));padding:calc(4*var(--u)) calc(14*var(--u));border-radius:999px;font-weight:800;white-space:nowrap;flex:none}
.task.wait{color:#6f7f9f}.task.wait .ic{filter:grayscale(1) opacity(.5)}
.task.wait .st{background:#ffffff12;color:#7f8fb0}
.task.doing{background:rgba(91,227,255,.12);border-color:var(--cyan);box-shadow:0 0 22px rgba(91,227,255,.35)}
.task.doing .st{background:var(--cyan);color:var(--navy);animation:pulse 1.4s infinite}
.task.done{color:#bfe9d6}.task.done .st{background:var(--green);color:var(--navy)}
.ctrl{margin-top:auto;display:flex;gap:calc(10*var(--u));padding-top:calc(6*var(--v));flex:none}
.ctrl span{display:flex;align-items:center;justify-content:center;gap:calc(8*var(--u));border-radius:calc(10*var(--u));padding:calc(8*var(--v)) calc(10*var(--u));white-space:nowrap;cursor:pointer;
  font-size:calc(22*var(--u));font-weight:800;border:2px solid;min-width:0}
/* 退回：淡黃（呼應退回閃框），約佔底部列 1/3 */
.ctrl .back{flex:1 1 0;color:#FFD27A;border-color:#FFD27A;background:rgba(255,210,122,.12)}
.ctrl .back:hover{background:rgba(255,210,122,.24)}
.ctrl .go{flex:2 1 0;color:var(--ink);border-color:#3f6aa8;background:rgba(47,111,214,.28)}
.ctrl .go small{font-size:calc(17*var(--u));font-weight:600;color:#9fb3d8}
.ctrl .go:hover{border-color:var(--cyan)}
.ctrl .off,.ctrl .off:hover{opacity:.3;cursor:default}
.ico{width:1em;height:1em;flex:none;display:block}
.ico.inl{display:inline-block;vertical-align:-.15em;margin-right:2px;color:#FFD27A}
.team.win{border-color:var(--green);box-shadow:0 0 40px rgba(76,224,160,.35);background:rgba(10,48,44,.85)}
.team.win .bar b{background:var(--green)}
.team.win .ct{color:var(--green)}
.stamp{margin-top:auto;border:4px solid var(--green);color:var(--green);background:rgba(8,19,33,.75);border-radius:calc(14*var(--u));padding:calc(6*var(--v)) calc(14*var(--u));
  display:flex;align-items:center;gap:calc(10*var(--u));font-weight:900;white-space:nowrap;flex:none}
.stamp .sc{flex:1;display:flex;justify-content:center;align-items:baseline;gap:calc(16*var(--u));min-width:0}
.stamp{overflow:hidden}
/* 橫條右側的退回：跟橫條同高的方形 */
.stamp .undo{flex:none;align-self:stretch;aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  margin:calc(-6*var(--v)) calc(-14*var(--u)) calc(-6*var(--v)) 0;font-size:calc(30*var(--u));cursor:pointer;
  color:#FFD27A;background:rgba(255,210,122,.14);border-left:3px solid #FFD27A}
.stamp .undo:hover{background:rgba(255,210,122,.28)}
.stamp .undo.off{opacity:.3;cursor:default;background:none}
/* 退回後閃黃框約 0.6 秒，看得出是退回 */
.team.flash{animation:flashback .6s ease-out}
@keyframes flashback{0%,55%{border-color:#FFD166;box-shadow:0 0 0 4px #FFD166,0 0 46px rgba(255,209,102,.65)}}
.stamp .a{font-size:calc(32*var(--u));letter-spacing:calc(3*var(--u))}.stamp .b{font-size:calc(22*var(--u));color:#bff5dd}
.team.lose{opacity:.75}
/* 組數多或任務多：上下留白壓緊，把高度留給字 */
.board.dense .team{--v:calc(var(--u)*.45)}
.board.dense .task{line-height:1.3}
.board.dense .task .ic{line-height:1.1}
.stamp.red{border-color:var(--red);color:var(--red)}.stamp.red .b{color:#ffd0d3}
.team.ready .task .st{background:#ffffff12;color:#9fb3d8}
@keyframes blink{50%{opacity:.2}}
@keyframes pulse{50%{opacity:.6}}

/* ===== 覆蓋層：後台、確認框 ===== */
.ovl{position:fixed;inset:0;background:rgba(2,6,12,.72);display:flex;align-items:center;justify-content:center;padding:2vh 2vw;z-index:10;user-select:text}
.ovl[hidden]{display:none}
#confirm{z-index:20}
.admin{display:grid;grid-template-columns:1fr 1fr;gap:20px;background:#0f1b2e;border:1px solid #22355a;border-radius:12px;padding:24px;
  width:min(1200px,100%);max-height:100%;overflow:auto;box-shadow:0 20px 60px #000a}
.admin .box{background:#132440;border-radius:10px;padding:18px}
.admin h3{margin:0 0 12px;font-size:16px;color:#fff}
.admin h2{grid-column:1/-1;margin:0;font-size:20px;color:#fff}
.row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:14px}
.row label{width:84px;color:#9fb3d8;flex:none}
.in{background:#0a1528;border:1px solid #2d4470;border-radius:6px;color:#fff;padding:7px 10px;font-size:14px;font-family:inherit;min-width:0}
.in.s{width:60px;text-align:center}.in.w{flex:1}
.btn{background:#1d3561;border:1px solid #3c5f9c;color:#dbe8ff;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer}
.btn:disabled{opacity:.35;cursor:default}
.btn.p{background:#2f6fd6;border-color:#2f6fd6;color:#fff;font-weight:700;padding:10px 20px;font-size:15px}
.btn.d{background:transparent;border-color:#6a3b47;color:#ff9aa0}
.btn.mv{padding:6px 9px}
.foot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid #22355a;padding-top:16px}
.foot p{margin:0;color:#8796b5;font-size:13px}
.foot div{white-space:nowrap}
.help{display:block!important;color:#aab6cf;line-height:1.9}
.dlg{background:#0f1b2e;border:1px solid #3c5f9c;border-radius:14px;padding:28px 32px;width:min(560px,100%);box-shadow:0 20px 60px #000c;color:#dfe7f5}
.dlg p{margin:0 0 22px;font-size:20px;line-height:1.6}
.dlg .acts{display:flex;justify-content:flex-end;gap:12px}
.dlg .btn{font-size:16px;padding:10px 20px}
.dlg .btn.danger{background:#c2414b;border-color:#c2414b;color:#fff;font-weight:700}
</style>
</head>
<body>
<div class="board" id="board" data-phase="ready"></div>

<div class="ovl" id="settings" hidden>
  <div class="admin" role="dialog" aria-label="後台設定">
    <div class="box">
      <h3>計時與標題</h3>
      <div class="row"><label for="set-title">標題</label><input class="in w" id="set-title"></div>
      <div class="row"><label for="set-sub">副標</label><input class="in w" id="set-sub"></div>
      <div class="row"><label for="set-min">倒數時間</label><input class="in s" id="set-min" inputmode="numeric"> 分 <input class="in s" id="set-sec" inputmode="numeric"> 秒</div>
      <div class="row"><label for="set-warn">最後提醒</label><input class="in s" id="set-warn" inputmode="numeric"> 秒前數字變紅閃爍</div>
      <h3 style="margin-top:22px">組別（2～8 組）</h3>
      <div class="row"><label for="set-teams">組數</label><button class="btn" id="teams-minus" type="button">－</button><input class="in s" id="set-teams" inputmode="numeric"><button class="btn" id="teams-plus" type="button">＋</button></div>
      <div id="set-team-list"></div>
    </div>
    <div class="box">
      <h3>任務（每組相同，依序進行）</h3>
      <div id="set-task-list"></div>
      <div class="row"><button class="btn" id="add-task" type="button">＋ 新增任務</button></div>
      <h3 style="margin-top:22px">操作說明（老師）</h3>
      <div class="row help" id="help"></div>
    </div>
    <div class="foot">
      <p>設定存在這台電腦的瀏覽器裡，下次打開還在。改了組數或任務會重設目前進度。</p>
      <div><button class="btn" id="restore" type="button">恢復預設</button>　<button class="btn" id="cancel" type="button">取消</button>　<button class="btn p" id="save" type="button">儲存並回到計分板</button></div>
    </div>
  </div>
</div>

<div class="ovl" id="confirm" hidden>
  <div class="dlg" role="alertdialog" aria-modal="true">
    <p id="confirm-msg"></p>
    <div class="acts"><button class="btn" id="confirm-cancel" type="button">取消</button><button class="btn danger" id="confirm-ok" type="button">確定</button></div>
  </div>
</div>

<script>
"use strict";
const DEF={title:"聲光研究所逃脫任務",sub:"五上自然・探索聲光世界",total:1500,warn:300,
  teams:["第 1 組","第 2 組","第 3 組","第 4 組"],
  tasks:[{id:"t1",ic:"📢",tn:"噪音控制室"},{id:"t2",ic:"🎸",tn:"樂器實驗室"},{id:"t3",ic:"🥤",tn:"折射錯覺室"},{id:"t4",ic:"🔦",tn:"光學研究室"}]};
const K_CFG="slb.config",K_ST="slb.state",MAX_TEAMS=8,MIN_TEAMS=2,MAX_TASKS=8;
const $=id=>document.getElementById(id);
const ICON_BACK='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4v6h6"/><path d="M3.5 15a9 9 0 1 0 2.1-9.4L3 10"/></svg>'; // 逆時針回轉箭頭（不靠字型）
const B=$("board");
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mmss=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
const clampInt=(v,lo,hi,d)=>{const n=parseInt(String(v).trim(),10);return isNaN(n)?d:Math.min(hi,Math.max(lo,n))};
const newId=()=>"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- 設定與狀態（localStorage） ---------- */
function loadJSON(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function saveJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function validCfg(c){
  if(!c||typeof c!=="object") return null;
  const out=clone(DEF);
  if(typeof c.title==="string") out.title=c.title;
  if(typeof c.sub==="string") out.sub=c.sub;
  if(Number.isFinite(c.total)&&c.total>=1) out.total=Math.round(c.total);
  if(Number.isFinite(c.warn)&&c.warn>=0) out.warn=Math.round(c.warn);
  if(Array.isArray(c.teams)&&c.teams.length>=MIN_TEAMS&&c.teams.length<=MAX_TEAMS) out.teams=c.teams.map((n,i)=>String(n||`第 ${i+1} 組`));
  if(Array.isArray(c.tasks)&&c.tasks.length>=1&&c.tasks.length<=MAX_TASKS)
    out.tasks=c.tasks.map((t,j)=>({id:String(t&&t.id||"x"+j),ic:String(t&&t.ic||""),tn:String(t&&t.tn||`任務 ${j+1}`)}));
  return out;
}
let cfg=validCfg(loadJSON(K_CFG))||clone(DEF);
let st;
function freshState(){return {phase:"ready",endAt:null,rem:cfg.total*1000,p:cfg.teams.map(()=>0),fin:cfg.teams.map(()=>null)}}
function loadState(){
  const s=loadJSON(K_ST),n=cfg.teams.length,N=cfg.tasks.length;
  if(!s||!["ready","run","pause","over","win"].includes(s.phase)||!Array.isArray(s.p)||s.p.length!==n||!Array.isArray(s.fin)||s.fin.length!==n
     ||s.sig!==sig()) return freshState();
  const o={phase:s.phase,endAt:s.endAt,rem:+s.rem||0,p:s.p.map(x=>clampInt(x,0,N,0)),fin:s.fin.map(x=>Number.isFinite(x)?x:null)};
  if(o.phase==="run"&&!Number.isFinite(o.endAt)) return freshState();
  return o;
}
function sig(){return cfg.total+"|"+cfg.teams.length+"|"+cfg.tasks.map(t=>t.id).join(",")}
function saveState(){saveJSON(K_ST,Object.assign({sig:sig()},st))}
function saveCfg(){saveJSON(K_CFG,cfg)}
st=loadState();

/* ---------- 計時：一律用 Date.now 的差，不累加 ---------- */
function remMs(){return st.phase==="run"?Math.max(0,st.endAt-Date.now()):Math.max(0,st.rem)}
function shownSec(){return Math.ceil(remMs()/1000)}
function toggleRun(){
  if(st.phase==="ready"){st.rem=cfg.total*1000;st.endAt=Date.now()+st.rem;st.phase="run"}
  else if(st.phase==="run"){st.rem=remMs();st.endAt=null;st.phase="pause"}
  else if(st.phase==="pause"){st.endAt=Date.now()+st.rem;st.phase="run"}
  else return;
  saveState();render();
}
function tick(){
  if(st.phase==="run"&&st.endAt-Date.now()<=0){st.phase="over";st.rem=0;st.endAt=null;saveState();render();return}
  updateTimer();
}

/* ---------- 推進／退回 ---------- */
function complete(i){
  const N=cfg.tasks.length;
  if(st.phase!=="run"||i>=cfg.teams.length||st.p[i]>=N) return;
  st.p[i]++;
  if(st.p[i]>=N) st.fin[i]=cfg.total-shownSec();
  if(st.p.every(x=>x>=N)){st.rem=remMs();st.endAt=null;st.phase="win"}
  saveState();render();
}
function stepBack(i){
  if(st.phase==="ready"||i>=cfg.teams.length||st.p[i]<=0) return;
  st.p[i]--;st.fin[i]=null;
  if(st.phase==="win"){st.endAt=Date.now()+st.rem;st.phase="run"} // 誤按造成的全部完成：回到進行中，從停下的時間接著倒數
  saveState();render();
  const el=B.querySelector(`.team[data-i="${i}"]`);
  if(el){el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),650)}
}
function resetAll(){st=freshState();saveState();render()}

/* ---------- 畫面 ---------- */
let fitKey=null,fitK=1;
function pillOf(){return {ready:["ready","系統待命"],run:["run","緊急修復中"],pause:["pause","緊急修復中"],over:["over","時間到"],win:["win","出口解鎖"]}[st.phase]}
function cardsHTML(probe,foot){
  const N=cfg.tasks.length;let h="";
  cfg.teams.forEach((nm,i)=>{
    const p=probe?N-1:st.p[i],done=!probe&&p>=N,ph=probe?(foot==="ctrl"?"run":"over"):st.phase;
    const cls=ph==="ready"?"ready":done?"win":ph==="over"?"lose":"";
    h+=`<div class="team ${cls}" data-i="${i}"><div class="hd"><div class="nm">${esc(nm)}</div><div class="ct">${p}/${N}</div></div>
      <div class="bar"><b style="width:${p/N*100}%"></b></div>`;
    cfg.tasks.forEach((t,j)=>{
      let s="wait",tx="等待";
      if(probe){s="doing";tx=probe}
      else if(j<p){s="done";tx="✔ 完成"}else if(j===p&&(ph==="run"||ph==="pause")){s="doing";tx="處理中"}
      h+=`<div class="task ${s}"><span class="ic">${esc(t.ic)}</span><span class="tn">${j+1}. ${esc(t.tn)}</span><span class="st">${tx}</span></div>`;
    });
    const undo=`<span class="undo${p<=0?" off":""}" title="退回一關（Shift＋${i+1}）" aria-label="退回一關">${ICON_BACK}</span>`;
    if((ph==="run"||ph==="pause")&&!done) h+=`<div class="ctrl"><span class="back${p<=0?" off":""}" title="退回一關（Shift＋${i+1}）">${ICON_BACK}退回</span><span class="go${ph==="pause"?" off":""}">完成本關 ▸<small>鍵${i+1}</small></span></div>`;
    if(done) h+=`<div class="stamp"><div class="sc"><div class="a">✔ 已完成</div><div class="b">用時 ${st.fin[i]==null?"--:--":mmss(st.fin[i])}</div></div>${undo}</div>`;
    else if(ph==="over") h+=`<div class="stamp red"><div class="sc"><div class="a">時間到</div><div class="b">完成 ${p}/${N}</div></div>${undo}</div>`;
    h+=`</div>`;
  });
  return h;
}
function render(){
  const n=cfg.teams.length,many=n>4,cols=many?Math.ceil(n/2):n;
  B.className="board"+(st.phase==="win"?" unlock":"")+(many?" many":"")+(many||cfg.tasks.length>=5?" dense":"");
  B.dataset.phase=st.phase;
  const pill=pillOf();
  B.innerHTML=`<div class="top"><div class="title">${esc(cfg.title)}<small>${esc(cfg.sub)||"&nbsp;"}</small></div>
    <div class="pill ${pill[0]}"><i></i>${pill[1]}</div></div>
    <div class="timer"><div class="lbl"></div><div class="num" title="點一下：開始／暫停（空白鍵）"><span class="num-text"></span><span class="pause-tag">暫停</span></div>
    <div class="energy"><b></b></div></div><div class="grid" style="grid-template-columns:repeat(${cols},minmax(0,1fr))"></div>
    <button id="gear" type="button" title="後台設定（S）" aria-label="後台設定">⚙&#xFE0E;</button>`;
  updateTimer();
  const grid=B.querySelector(".grid");
  const key=JSON.stringify([cfg.teams,cfg.tasks]);
  if(key!==fitKey){fitK=fitCards(grid);fitKey=key}
  grid.style.setProperty("--k",fitK);
  grid.innerHTML=cardsHTML(false);
}
/* 用最占空間的樣子（每組都有「時間到」章、每列狀態都用最寬的字）量，縮到不爆框為止 */
function fitCards(grid){return Math.min(fitWith(grid,"處理中","stamp"),fitWith(grid,"✔ 完成","stamp"),fitWith(grid,"處理中","ctrl"))}
function fitWith(grid,label,foot){
  grid.innerHTML=cardsHTML(label,foot);
  const over=()=>[...grid.querySelectorAll(".team")].some(t=>t.scrollHeight>t.clientHeight+1||t.scrollWidth>t.clientWidth+1||
    [...t.querySelectorAll(".task,.hd,.stamp,.ctrl")].some(e=>e.scrollWidth>e.clientWidth+1));
  let k=1;
  grid.style.setProperty("--k",k);
  while(over()&&k>0.3){k=Math.round((k-0.02)*100)/100;grid.style.setProperty("--k",k)}
  return k;
}
function updateTimer(){
  const tm=B.querySelector(".timer");if(!tm) return;
  const s=shownSec(),ph=st.phase;
  const cls=ph==="win"?"win":ph==="over"?"over":((ph==="run"||ph==="pause")&&s<=cfg.warn?"warn":"");
  const c="timer"+(cls?" "+cls:"")+(ph==="pause"?" paused":"");
  if(tm.className!==c) tm.className=c;
  const lbl=ph==="win"?"修復完成":ph==="over"?"備用電力耗盡":"備用電力剩餘";
  const L=tm.querySelector(".lbl");if(L.textContent!==lbl) L.textContent=lbl;
  const T=tm.querySelector(".num-text"),txt=mmss(s);if(T.textContent!==txt) T.textContent=txt;
  tm.querySelector(".energy b").style.width=(cfg.total?Math.min(100,remMs()/(cfg.total*1000)*100):0)+"%";
}
function scale(){
  const w=innerWidth,h=innerHeight,s=Math.min(w/1920,h/1080);
  B.style.transform=`translate(${(w-1920*s)/2}px,${(h-1080*s)/2}px) scale(${s})`;
}

/* ---------- 頁內確認框（不用原生 confirm） ---------- */
let confirmOk=null;
function askConfirm(msg,okText,onOk){
  $("confirm-msg").textContent=msg;$("confirm-ok").textContent=okText||"確定";
  confirmOk=onOk;$("confirm").hidden=false;
}
function closeConfirm(ok){
  const f=confirmOk;confirmOk=null;$("confirm").hidden=true;
  if(ok&&f) f();
}
$("confirm-ok").onclick=()=>closeConfirm(true);
$("confirm-cancel").onclick=()=>closeConfirm(false);
$("confirm").addEventListener("click",e=>{if(e.target===$("confirm")) closeConfirm(false)});

/* ---------- 後台 ---------- */
let ed=null;
const settingsOpen=()=>!$("settings").hidden;
function openSettings(){
  ed={title:cfg.title,sub:cfg.sub,min:String(Math.floor(cfg.total/60)).padStart(2,"0"),sec:String(cfg.total%60).padStart(2,"0"),
      warn:String(cfg.warn),teams:cfg.teams.slice(),tasks:clone(cfg.tasks)};
  renderEditor();$("settings").hidden=false;
}
function closeSettings(){$("settings").hidden=true;ed=null;if(document.activeElement) document.activeElement.blur()}
function renderEditor(){
  $("set-title").value=ed.title;$("set-sub").value=ed.sub;$("set-min").value=ed.min;$("set-sec").value=ed.sec;$("set-warn").value=ed.warn;
  $("set-teams").value=ed.teams.length;
  $("teams-minus").disabled=ed.teams.length<=MIN_TEAMS;$("teams-plus").disabled=ed.teams.length>=MAX_TEAMS;
  $("set-team-list").innerHTML=ed.teams.map((n,i)=>`<div class="row"><label>第 ${i+1} 組</label><input class="in w" data-team="${i}" value="${esc(n)}"></div>`).join("");
  const M=ed.tasks.length;
  $("set-task-list").innerHTML=ed.tasks.map((t,j)=>`<div class="row task-row" data-j="${j}">
    <button class="btn mv up" type="button" title="上移" ${j===0?"disabled":""}>▲</button><button class="btn mv down" type="button" title="下移" ${j===M-1?"disabled":""}>▼</button>
    <input class="in s set-ic" value="${esc(t.ic)}"><input class="in w set-tn" value="${esc(t.tn)}"><button class="btn d del" type="button" ${M<=1?"disabled":""}>刪除</button></div>`).join("");
  $("add-task").disabled=M>=MAX_TASKS;
  $("help").innerHTML=`空白鍵或點倒數數字：開始／暫停倒數<br>1～${ed.teams.length}（對應組別）或點該組卡片：完成本關<br>卡片上的 ${ICON_BACK.replace('class="ico"','class="ico inl"')}退回（或 Shift＋數字）：退回一關<br>R：重設（會先確認）　F：全螢幕　S：打開這個設定頁　Esc：關閉`;
}
function readEditor(){
  ed.title=$("set-title").value;ed.sub=$("set-sub").value;ed.min=$("set-min").value;ed.sec=$("set-sec").value;ed.warn=$("set-warn").value;
  document.querySelectorAll("#set-team-list input").forEach(el=>ed.teams[+el.dataset.team]=el.value);
  document.querySelectorAll("#set-task-list .task-row").forEach(r=>{const t=ed.tasks[+r.dataset.j];t.ic=r.querySelector(".set-ic").value;t.tn=r.querySelector(".set-tn").value});
}
function setTeamCount(c){
  c=clampInt(c,MIN_TEAMS,MAX_TEAMS,ed.teams.length);
  while(ed.teams.length<c) ed.teams.push(`第 ${ed.teams.length+1} 組`);
  ed.teams.length=c;renderEditor();
}
$("settings").addEventListener("input",e=>{if(ed&&e.target.id!=="set-teams") readEditor()});
$("set-teams").addEventListener("change",e=>{readEditor();setTeamCount(e.target.value)});
$("teams-minus").onclick=()=>{readEditor();setTeamCount(ed.teams.length-1)};
$("teams-plus").onclick=()=>{readEditor();setTeamCount(ed.teams.length+1)};
$("add-task").onclick=()=>{readEditor();if(ed.tasks.length<MAX_TASKS){ed.tasks.push({id:newId(),ic:"⭐",tn:`任務 ${ed.tasks.length+1}`});renderEditor()}};
$("set-task-list").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b) return;
  readEditor();const j=+b.closest(".task-row").dataset.j,T=ed.tasks;
  if(b.classList.contains("up")&&j>0) [T[j-1],T[j]]=[T[j],T[j-1]];
  else if(b.classList.contains("down")&&j<T.length-1) [T[j+1],T[j]]=[T[j],T[j+1]];
  else if(b.classList.contains("del")&&T.length>1) T.splice(j,1);
  renderEditor();
});
$("restore").onclick=()=>{const d=clone(DEF);ed={title:d.title,sub:d.sub,min:"25",sec:"00",warn:String(d.warn),teams:d.teams,tasks:d.tasks};
  ed.min=String(Math.floor(d.total/60)).padStart(2,"0");ed.sec=String(d.total%60).padStart(2,"0");renderEditor()};
$("cancel").onclick=closeSettings;
$("save").onclick=()=>{
  readEditor();
  const total=Math.max(1,clampInt(ed.min,0,99,0)*60+clampInt(ed.sec,0,59,0));
  const next={title:ed.title.trim()||DEF.title,sub:ed.sub.trim(),total,warn:clampInt(ed.warn,0,99*60,DEF.warn),
    teams:ed.teams.map((n,i)=>n.trim()||`第 ${i+1} 組`),
    tasks:ed.tasks.map((t,j)=>({id:t.id,ic:t.ic.trim(),tn:t.tn.trim()||`任務 ${j+1}`}))};
  const structural=next.total!==cfg.total||next.teams.length!==cfg.teams.length||next.tasks.map(t=>t.id).join()!==cfg.tasks.map(t=>t.id).join();
  const apply=()=>{cfg=next;saveCfg();if(structural) st=freshState();saveState();closeSettings();render()};
  if(structural&&st.phase!=="ready") askConfirm("改了組數、任務（數量或順序）或倒數時間，目前的進度會重設回「開始前」。確定要儲存嗎？","重設並儲存",apply);
  else apply();
};
$("settings").addEventListener("click",e=>{if(e.target===$("settings")) closeSettings()});

/* ---------- 輸入 ---------- */
B.addEventListener("click",e=>{
  if(settingsOpen()||!$("confirm").hidden) return;
  if(e.target.closest("#gear")){openSettings();return}
  if(e.target.closest(".timer .num")){toggleRun();return}
  const back=e.target.closest(".ctrl .back,.stamp .undo");
  if(back){e.stopPropagation();if(!back.classList.contains("off")) stepBack(+back.closest(".team").dataset.i);return} // 退回鈕不觸發整張卡的完成本關
  const t=e.target.closest(".team");if(t) complete(+t.dataset.i);
});
function toggleFullscreen(){
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  else if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
}
addEventListener("keydown",e=>{
  if(!$("confirm").hidden){
    if(e.key==="Escape"){e.preventDefault();closeConfirm(false)}
    else if(e.key==="Enter"){e.preventDefault();closeConfirm(true)}
    else if(e.key!=="Tab") e.preventDefault();
    return;
  }
  if(settingsOpen()){
    if(e.key==="Escape"){e.preventDefault();closeSettings()}
    return; // 其他鍵留給輸入框
  }
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const m=/^(?:Digit|Numpad)([1-9])$/.exec(e.code);
  if(m){e.preventDefault();if(e.repeat) return;const i=+m[1]-1;e.shiftKey?stepBack(i):complete(i);return}
  switch(e.code){
    case "Space":e.preventDefault();if(!e.repeat) toggleRun();break;
    case "KeyR":e.preventDefault();askConfirm("要重設計分板嗎？倒數會回到 "+mmss(cfg.total)+"，各組進度清空。","重設",resetAll);break;
    case "KeyS":e.preventDefault();openSettings();break;
    case "KeyF":e.preventDefault();toggleFullscreen();break;
  }
});
addEventListener("resize",scale);
document.addEventListener("visibilitychange",tick);
addEventListener("storage",e=>{if(e.key===K_CFG||e.key===K_ST){cfg=validCfg(loadJSON(K_CFG))||clone(DEF);st=loadState();render()}});

if(st.phase==="run"&&st.endAt-Date.now()<=0){st.phase="over";st.rem=0;st.endAt=null;saveState()}
scale();render();
setInterval(tick,200);
</script>
</body>
